        #loading-text {
            font-weight: bold;
            background: linear-gradient(

                #ff0000,
                #ff7f00,
                #ffff00,
                #00ff00,

                #4b0082,

            );

            -webkit-text-fill-color: transparent;
            animation: rainbow 3s ease infinite;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========= 虚拟摇杆样式 (透明且在最上层) ========= */
        .virtual-joystick {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            z-index: 10000;
            touch-action: none;
            display: none;  /* 默认隐藏，仅在移动端显示 */
        }
        .joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 0 15px rgba(0,0,0,0.2);
            transition: all 0.05s ease;
        }
        .joystick-thumb {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            transition: transform 0.02s linear;
            pointer-events: none;
        }
        /* 仅在触摸设备且为移动端（或平板）显示摇杆 */
        @media (hover: none) and (pointer: coarse) {
            .virtual-joystick {
                display: block;
            }
        }
        /* 小屏幕适配稍微缩小摇杆 */
        @media (max-width: 600px) {
            .virtual-joystick {
                width: 110px;
                height: 110px;
                bottom: 20px;
                left: 20px;
            }
            .joystick-thumb {
                width: 42px;
                height: 42px;
            }
        }
        /* 确保canvas区域不会被摇杆遮挡关键UI，但摇杆在左上区域不影响主要操作 */
        .unity-desktop {
            position: relative;
        }

<script>
      var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '101.82';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [wasmUrl, dataUrl] = await Promise.all([
        mergeFiles(getParts("Build/brawl.wasm", 1, 4), "brawl.wasm"),
        mergeFiles(getParts("Build/brawl.data", 1, 2), "brawl.data"),
      ]);

        const loaderUrl = buildUrl + "/brawl.loader.js";
        const config = {
            dataUrl: dataUrl,
            frameworkUrl: buildUrl + "/brawl.framework.js",
            codeUrl: wasmUrl,

        };

        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        const canFullscreen = (function () {
            for (const key of [

                'msExitFullscreen',
            ]) {

        window.addEventListener('blur', () => SetVisibility(false));
        window.addEventListener('focus', () => SetVisibility(true));


        window.addEventListener('pointerdown', () => {
            FocusGame();

        const oRequestPointerLock = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
            try {
                (args[0] ||= {}).unadjustedMovement = true;
                await oRequestPointerLock.apply(this, args);
            } catch (err) {

            }

        window.InstallBlurFocusBlocker = function() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                let blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';

                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) {
                        blockerButton.parentNode.removeChild(blockerButton);
                    }
                    window.removeEventListener('focus', removeBlocker);
                }

                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        window.FocusGame = function() {
            if (!isPausedGame) canvas.focus();
        }

        window.SetVisibility = function(visibility) {
            if (ysdk !== null && initGame === true && isVisibility !== visibility) {

                if (!visibility) {
                    YG2Instance('SetFocusWindowGame', 'false');
                }
                else {
                    YG2Instance('SetFocusWindowGame', 'true');
                }
            }
        }

        const PauseCallback = () => {
            isPausedGame = true;
            YG2Instance('SetPauseGame', 'true');
        };

        const ResumeCallback = () => {
            isPausedGame = false;
            YG2Instance('SetPauseGame', 'false');
        };

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    const adjustedProgress = Math.max(progress, 0.05);
                    progressBarFull.style.width = `${100 * adjustedProgress}%`;

        window.IsLocalHost = function() {
            try {
                if (window.top !== window) {
                    return false;
                }

                const host = window.location.hostname;
                if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) {
                    LogStyledMessage("Local Host");
                    return true;
                }
            } 
            catch (error) {
                console.error("Error checking the local host:", error);

        window.YG2Instance = function(method) {

        }
        window.YG2Instance = function(method, arg) {

        window.LogStyledMessage  = function (message, style) {
            console.log('%c' + message, style || 'color: #FFDF73; background-color: #454545');
        }
        
        window.InitYSDK = async function () {
            try {
                if (IsLocalHost()) return;

                ysdk.on('game_api_pause', PauseCallback);
                ysdk.on('game_api_resume', ResumeCallback);

                // Additional init0 modules
await RequestingEnvironmentData();
LogStyledMessage('Init EnvirData ysdk');


                // Additional init1 modules

await InitPlayer();
LogStyledMessage('Init Authorization ysdk');


                // Additional init modules
await LoadCloud();
LogStyledMessage('Init Storage ysdk');

await InitReview();
LogStyledMessage('Init Review ysdk');

await GetStats();
LogStyledMessage('Init PlayerStats ysdk');

await InitPayments();
LogStyledMessage('Init Payments ysdk');

await GetAllGames();
LogStyledMessage('Init OpenURL ysdk');

await InitGameLabel();
LogStyledMessage('Init GameLabel ysdk');


                initYSDK = true;
                if (ygGameInstance != null)
                    ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');

                LogStyledMessage('Init YandexSDK Success');

            } catch (e) {
                console.error('CRASH Initialization SDK: ', e);
            }

            if (!IsLocalHost() && !syncInit)
                StartUnityInstance_IfUnloaded();
        }

window.InitGame = function() {

window.LoadCloud = function() {
    return new Promise((resolve) => {
        if (ysdk == null) {
            Final(window.NO_DATA);
            return;
        }
        try {
            player.getData(["saves"]).then(data => {

                }
            }).catch(() => {

                Final(NO_DATA);
            });
        }
        catch (e) {

            Final(NO_DATA);

            cloudSaves = res;
            YG2Instance('SetLoadSaves', res);
            resolve(res);
        }

}

window.reviewData = 'false';

window.InitReview = function() {
    return new Promise((resolve) => {
        if (ysdk == null) {
            resolve('false');
            return;
        }
        try {
            ysdk.feedback.canReview().then(({ value }) => {
                if (value) {
                    reviewData = 'true';
                    resolve('true');
                }
                else {
                    resolve('false');
                }
            });
        }
        catch (e) {
            console.error('CRASH Init Review: ', e.message);
            resolve('false');
        }
    });
}

window.Review = function() {
    try {
        ysdk.feedback.canReview()
            .then(({ value, reason }) => {
                if (value) {
                    ysdk.feedback.requestReview().then(({ feedbackSent }) => {
                        LogStyledMessage('feedbackSent ', feedbackSent);
                        if (feedbackSent) {
                            LogStyledMessage('Review Success')
                            YG2Instance('ReviewSent', 'true');
                        }
                        else {
                            YG2Instance('ReviewSent', 'false');
                            LogStyledMessage('Review Fail', reason)
                        }
                        FocusGame();
                    })
                }
                else {
                    LogStyledMessage('Review can show = false', reason);
                    FocusGame();
                }
            })
    } catch (e) {
        console.error('CRASH Review: ', e.message);
        FocusGame();
    }
}

window.paymentsData = NO_DATA;
let payments = null;

window.InitPayments = function(sendback) {
    return new Promise((resolve) => {
        try {
            if (ysdk == null) {
                Final(NO_DATA);
                return;
            }

            ysdk.getPayments().then(_payments => {
                payments = _payments;

                payments.getCatalog()
                    .then(products => {
                        let productID = [];
                        let title = [];
                        let description = [];
                        let imageURI = [];
                        let price = [];
                        let priceValue = [];
                        let priceCurrencyCode = [];
                        let currencyImageURL = [];
                        let consumed = [];

                        payments.getPurchases().then(purchases => {
                            for (let i = 0; i < products.length; i++) {
                                productID[i] = products[i].id;
                                title[i] = products[i].title;
                                description[i] = products[i].description;
                                imageURI[i] = products[i].imageURI;
                                price[i] = products[i].price;
                                priceValue[i] = products[i].priceValue;
                                priceCurrencyCode[i] = products[i].priceCurrencyCode;
                                currencyImageURL[i] = products[i].getPriceCurrencyImage("medium");

                                consumed[i] = true;
                                for (i2 = 0; i2 < purchases.length; i2++) {
                                    if (purchases[i2].productID === productID[i]) {
                                        consumed[i] = false;
                                        break;
                                    }
                                }
                            }

                            let jsonPayments = {
                                "id": productID,
                                "title": title,
                                "description": description,
                                "imageURI": imageURI,
                                "price": price,
                                "priceValue": priceValue,
                                "priceCurrencyCode": priceCurrencyCode,
                                "currencyImageURL": currencyImageURL,
                                "consumed": consumed,
                                "language": "en"
                            };

                            Final(JSON.stringify(jsonPayments));
                        });
                    });

            }).catch(e => {
                LogStyledMessage('Purchases are not available', e.message);
                Final(NO_DATA);
            })
        } catch (e) {
            console.error('CRASH Init Payments: ', e.message);
            Final(NO_DATA);
        }

        function Final(res) {
            paymentsData = res;
            YG2Instance('PaymentsEntries', res);
            resolve(res);
        }
    });
}

            resolve(res);

window.GetLeaderboard = function(nameLB, quantityTop, quantityAround, photoSize, auth) {
    if (!ysdk) return;

    var jsonEntries = {
        technoName: '',
        isDefault: false,
        isInvertSortOrder: false,
        decimalOffset: 0,
        type: ''
    };

    ysdk.leaderboards.getDescription(nameLB)
        .then(res => {
            jsonEntries.technoName = nameLB;
            jsonEntries.isDefault = res.default;
            jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
            jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
            jsonEntries.type = res.description.type;

            return ysdk.leaderboards.getEntries(nameLB, {
                quantityTop: quantityTop,
                includeUser: auth,
                quantityAround: quantityAround
            });
        })
        .then(res => {
            let jsonPlayers = EntriesLB(res, photoSize);
            let combinedJson = { ...jsonEntries, ...jsonPlayers };

            YG2Instance('LeaderboardEntries', JSON.stringify(combinedJson));
        })
        .catch(err => {

               LogStyledMessage('Leaderboard player not present');
            console.error(err);
        });
}

window.EntriesLB = function(res, photoSize) {
    let LbdEntriesText = '';
    let plCount = res.entries.length;

    let ranks = new Array(plCount);
    let photos = new Array(plCount);
    let names = new Array(plCount);
    let scores = new Array(plCount);
    let uniqueIDs = new Array(plCount);
    let extraDataArray = new Array(plCount);

    for (i = 0; i < plCount; i++) {
        ranks[i] = res.entries[i].rank;
        scores[i] = res.entries[i].score;
        uniqueIDs[i] = res.entries[i].player.uniqueID;
        photos[i] = res.entries[i].player.getAvatarSrc(photoSize);

        if (res.entries[i].extraData == "" || res.entries[i].extraData == null)
            extraDataArray[i] = NO_DATA;
        else
            extraDataArray[i] = res.entries[i].extraData;

        if (res.entries[i].player.scopePermissions.public_name !== "allow")
            names[i] = "anonymous";
        else
            names[i] = res.entries[i].player.publicName;

        LbdEntriesText += ranks[i] + '. ' + names[i] + ": " + scores[i] + '\n';
    }

    if (plCount === 0) {
        LbdEntriesText = 'no data';
    }

    let jsonPlayers = {
        "entries": LbdEntriesText,
        "ranks": ranks,
        "photos": photos,
        "names": names,
        "scores": scores,
        "uniqueIDs": uniqueIDs,
        "extraDataArray": extraDataArray
    };

    return jsonPlayers;
}

window.environmentData = NO_DATA;

window.RequestingEnvironmentData = function() {
    return new Promise((resolve) => {
        if (ysdk == null) {
            Final(NO_DATA);
            return;
        }
        try {
            var browser = navigator.userAgent;
            if (browser.includes('YaBrowser') || browser.includes('YaSearchBrowser'))
                browser = 'Yandex';
            else if (browser.includes('Opera') || browser.includes('OPR'))
                browser = 'Opera';
            else if (browser.includes('Firefox'))
                browser = 'Firefox';
            else if (browser.includes('MSIE'))
                browser = 'IE';
            else if (browser.includes('Edge'))
                browser = 'Edge';
            else if (browser.includes('Chrome'))
                browser = 'Chrome';
            else if (browser.includes('Safari'))
                browser = 'Safari';
            else
                browser = 'Other';

            let jsonEnvir = {
                "language": "en",
                "domain": "com",
                "deviceType": ysdk.deviceInfo.type,
                "isMobile": ysdk.deviceInfo.isMobile(),
                "isDesktop": ysdk.deviceInfo.isDesktop(),
                "isTablet": ysdk.deviceInfo.isTablet(),
                "isTV": ysdk.deviceInfo.isTV(),
                "appID": ysdk.environment.app.id,
                "browserLang": "en",
                "payload": ysdk.environment.payload,
                "platform": navigator.platform,
                "browser": browser
            };

            Final(JSON.stringify(jsonEnvir));
            LogStyledMessage("Environment Data: " + JSON.stringify(jsonEnvir));
        }
        catch (e) {
            console.error('CRASH Requesting Environment Data: ', e.message);
            Final(NO_DATA);
        }

        function Final(res) {
            environmentData = res;
            YG2Instance('SetEnvirData', res);
            resolve(res);
        }
    });
}

// ========= 透明虚拟摇杆核心逻辑 (模拟WASD移动) =========
(function initVirtualJoystick() {
    // 仅在支持触摸的设备且移动端样式已显示时初始化 (通过CSS媒体查询控制显示，但逻辑也需检测触摸能力)
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouchDevice) return; // 非触摸设备不启用摇杆逻辑

    const joystickContainer = document.getElementById('virtualJoystick');
    const base = document.getElementById('joystickBase');
    const thumb = document.getElementById('joystickThumb');
    if (!joystickContainer || !base || !thumb) return;

    let active = false;
    let startX = 0, startY = 0;
    let currentDx = 0, currentDy = 0;
    let animFrameId = null;
    let currentActiveKeys = new Set();   // 当前模拟按下的键 (w/a/s/d)
    
    const maxRadius = 45;      // 最大移动半径 (px)
    const deadZone = 0.2;      // 方向死区阈值
    
    // 获取canvas用于派发事件及焦点
    const canvas = document.getElementById('unity-canvas');
    
    // 辅助函数: 派发键盘事件到document (确保Unity能捕获)
    function dispatchKeyEvent(type, key, code) {
        try {
            const event = new KeyboardEvent(type, {
                key: key,
                code: code,
                bubbles: true,
                cancelable: true,
                view: window
            });
            // 同时派发到canvas和document，增加兼容性
            if (canvas) canvas.dispatchEvent(event);
            document.dispatchEvent(event);
        } catch(e) {
            // fallback
        }
    }
    
    // 更新按键状态 (根据方向矢量)
    function updateKeysFromVector(dx, dy) {
        const magnitude = Math.hypot(dx, dy);
        let normX = 0, normY = 0;
        if (magnitude > deadZone) {
            normX = dx / magnitude;
            normY = dy / magnitude;
        }
        
        // 计算需要按下的键 (基于WASD)
        const shouldPress = new Set();
        // 上 (W) : 垂直负方向
        if (normY < -deadZone) shouldPress.add('w');
        // 下 (S) : 垂直正方向
        if (normY > deadZone) shouldPress.add('s');
        // 左 (A) : 水平负方向
        if (normX < -deadZone) shouldPress.add('a');
        // 右 (D) : 水平正方向
        if (normX > deadZone) shouldPress.add('d');
        
        // 找出需要释放的按键 (之前按下但新方向不需要)
        const toRelease = [...currentActiveKeys].filter(k => !shouldPress.has(k));
        // 找出需要按下的按键
        const toPress = [...shouldPress].filter(k => !currentActiveKeys.has(k));
        
        // 发送keyup事件
        for (let key of toRelease) {
            let code = `Key${key.toUpperCase()}`;
            dispatchKeyEvent('keyup', key, code);
            currentActiveKeys.delete(key);
        }
        // 发送keydown事件
        for (let key of toPress) {
            let code = `Key${key.toUpperCase()}`;
            dispatchKeyEvent('keydown', key, code);
            currentActiveKeys.add(key);
        }
    }
    
    // 重置摇杆UI与按键
    function resetJoystick() {
        active = false;
        // 释放所有仍按下的按键
        for (let key of currentActiveKeys) {
            let code = `Key${key.toUpperCase()}`;
            dispatchKeyEvent('keyup', key, code);
        }
        currentActiveKeys.clear();
        currentDx = 0;
        currentDy = 0;
        // 重置thumb位置
        thumb.style.transform = 'translate(-50%, -50%)';
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = null;
    }
    
    // 更新摇杆视觉与按键 (触摸移动时调用)
    function updateJoystick(clientX, clientY) {
        if (!active) return;
        const rect = base.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top + rect.height/2;
        let dx = clientX - centerX;
        let dy = clientY - centerY;
        const distance = Math.min(maxRadius, Math.hypot(dx, dy));
        if (distance > 0) {
            dx = dx * distance / Math.hypot(dx, dy);
            dy = dy * distance / Math.hypot(dx, dy);
        } else {
            dx = 0; dy = 0;
        }
        currentDx = dx;
        currentDy = dy;
        // 移动thumb UI
        const thumbX = (dx / maxRadius) * 100;
        const thumbY = (dy / maxRadius) * 100;
        thumb.style.transform = `translate(calc(-50% + ${thumbX}%), calc(-50% + ${thumbY}%))`;
        
        // 计算归一化方向矢量 (范围 -1..1)
        let normX = dx / maxRadius;
        let normY = dy / maxRadius;
        // 限制范围
        normX = Math.min(1, Math.max(-1, normX));
        normY = Math.min(1, Math.max(-1, normY));
        
        // 实时更新按键
        updateKeysFromVector(normX, normY);
    }
    
    // 触摸开始
    function onTouchStart(e) {
        e.preventDefault();
        e.stopPropagation();
        const touch = e.touches[0];
        if (!touch) return;
        const rect = base.getBoundingClientRect();
        const touchX = touch.clientX;
        const touchY = touch.clientY;
        // 检测触摸点是否在摇杆底座范围内
        if (touchX >= rect.left && touchX <= rect.right && touchY >= rect.top && touchY <= rect.bottom) {
            active = true;
            // 让canvas获得焦点 (确保游戏响应)
            if (window.FocusGame) window.FocusGame();
            else if (canvas) canvas.focus();
            // 初始定位thumb
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            let dx = touchX - centerX;
            let dy = touchY - centerY;
            const distance = Math.min(maxRadius, Math.hypot(dx, dy));
            if (distance > 0) {
                dx = dx * distance / Math.hypot(dx, dy);
                dy = dy * distance / Math.hypot(dy, dy);
            } else {
                dx = 0; dy = 0;
            }
            currentDx = dx;
            currentDy = dy;
            const thumbX = (dx / maxRadius) * 100;
            const thumbY = (dy / maxRadius) * 100;
            thumb.style.transform = `translate(calc(-50% + ${thumbX}%), calc(-50% + ${thumbY}%))`;
            let normX = dx / maxRadius;
            let normY = dy / maxRadius;
            normX = Math.min(1, Math.max(-1, normX));
            normY = Math.min(1, Math.max(-1, normY));
            updateKeysFromVector(normX, normY);
        }
    }
    
    function onTouchMove(e) {
        if (!active) return;
        e.preventDefault();
        e.stopPropagation();
        const touch = e.touches[0];
        if (touch) {
            updateJoystick(touch.clientX, touch.clientY);
        }
    }
    
    function onTouchEnd(e) {
        if (!active) return;
        e.preventDefault();
        e.stopPropagation();
        resetJoystick();
    }
    
    function onTouchCancel(e) {
        if (!active) return;
        e.preventDefault();
        e.stopPropagation();
        resetJoystick();
    }
    
    // 绑定摇杆区域事件
    joystickContainer.addEventListener('touchstart', onTouchStart, { passive: false });
    joystickContainer.addEventListener('touchmove', onTouchMove, { passive: false });
    joystickContainer.addEventListener('touchend', onTouchEnd, { passive: false });
    joystickContainer.addEventListener('touchcancel', onTouchCancel, { passive: false });
    
    // 防止全局页面滚动
    document.body.addEventListener('touchmove', function(e) {
        if (active && e.target === joystickContainer || joystickContainer.contains(e.target)) {
            e.preventDefault();
        }
    }, { passive: false });
    
    // 初始状态无按键
    console.log('[Joystick] A transparent virtual joystick has been loaded; mobile devices can use WASD to simulate it.');
})();
</script>

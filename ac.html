<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AC Remote</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="api.js"></script>
<style>
  :root{
    --bg:#eef2f1; --card:#ffffff; --text:#14201e; --muted:#6a7b78;
    --line:#d6dfdd; --accent:#0f8b8d; --accent-text:#ffffff; --off:#c0392b;
    --ok:#1e8e5a; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1514; --card:#162220; --text:#e6f0ee; --muted:#8aa09c;
           --line:#2a3b38; --accent:#3cc4c6; --accent-text:#06201f; --off:#ff7a6b; --ok:#4fd18f; --err:#ff7a6b; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  }
  .remote{
    position:relative; width:100%; max-width:360px; background:var(--card);
    border:1px solid var(--line); border-radius:28px; padding:28px 24px 24px;
  }
  .lang{position:absolute; top:16px; right:16px; border:1px solid var(--line); background:transparent; color:var(--muted); font:inherit; font-size:.8rem; padding:5px 10px; border-radius:999px; cursor:pointer}
  h1{font-size:1.05rem; font-weight:600; letter-spacing:.04em; color:var(--muted); text-align:center}
  .readout{
    margin:22px 0 20px; text-align:center; min-height:120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .readout .value{font-size:4.6rem; font-weight:300; line-height:1; font-variant-numeric:tabular-nums}

  /* Liquid glass switch */
  .mode{
    --x:0%; --s:1;
    position:relative; display:grid; grid-template-columns:1fr 1fr; padding:4px; margin-bottom:18px;
    border-radius:999px; isolation:isolate;
    background:
      linear-gradient(
        90deg,
        rgba(30, 142, 90, 0.18) 0%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(192, 57, 43, 0.18) 100%
      ),
      #fff;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.14), inset 0 -1px 0 rgba(255,255,255,.35), 0 1px 0 rgba(255,255,255,.4);
  }
  .mode[data-state="off"]{--x:100%}
  .mode:active{--s:1.07}
  .mode .thumb{
    position:absolute; z-index:0; top:4px; bottom:4px; left:4px; width:calc(50% - 4px);
    border-radius:999px; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.16) 55%, rgba(255,255,255,.3));
    -webkit-backdrop-filter:blur(7px) saturate(190%) brightness(1.08);
            backdrop-filter:blur(7px) saturate(190%) brightness(1.08);
    box-shadow:
      inset 0 1.5px 1px rgba(255,255,255,.95),     /* 上緣高光 */
      inset 0 -1.5px 2px rgba(255,255,255,.45),    /* 下緣反光 */
      inset 0 0 0 1px rgba(255,255,255,.35),
      0 6px 14px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.15);
    transform:translateX(var(--x)) scale(var(--s));
    transition:transform .5s cubic-bezier(.34,1.45,.5,1);
  }
  .mode button{
    position:relative; z-index:1; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:1.05rem; font-weight:700; padding:12px 0; border-radius:999px; cursor:pointer;
    transition:color .25s;
  }
  .mode button[aria-pressed="true"]{color:var(--text)}
  .mode button[data-mode="on"][aria-pressed="true"]{color:var(--ok)}
  .mode button[data-mode="off"][aria-pressed="true"]{color:var(--off)}
  @media (prefers-color-scheme: dark){
    .mode{box-shadow: inset 0 2px 8px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.08)}
    .mode .thumb{
      background:linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.07) 55%, rgba(255,255,255,.16));
      box-shadow: inset 0 1.5px 1px rgba(255,255,255,.55), inset 0 -1.5px 2px rgba(255,255,255,.18),
                  inset 0 0 0 1px rgba(255,255,255,.18), 0 6px 14px rgba(0,0,0,.5);
    }
  }
  @media (prefers-reduced-motion: reduce){ .mode .thumb{transition:none} }
  .readout.is-off .value{color:var(--off); font-weight:500}

  .temp{display:grid; grid-template-columns:56px 1fr 56px; gap:12px; align-items:center; margin-bottom:20px}
  .step{
    width:56px; height:56px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--text); font-size:1.6rem; cursor:pointer; line-height:1;
  }
  .step:active{background:var(--bg)}
  input[type=range]{width:100%; accent-color:var(--accent); height:32px}

  .send{
    width:100%; border:0; border-radius:16px; padding:16px; font:inherit; font-size:1.1rem; font-weight:700;
    background:var(--accent); color:var(--accent-text); cursor:pointer;
  }
  .send:disabled{opacity:.55; cursor:default}
  .temp.is-disabled{opacity:.4}
  .temp.is-disabled .step,.temp.is-disabled input{cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .status{margin-top:14px; min-height:1.3em; text-align:center; font-size:.9rem; color:var(--muted)}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
</style>
</head>
<body>
<main class="remote">
  <button type="button" class="lang" id="langBtn"></button>
  <h1 data-i18n="title">AC Remote</h1>

  <div class="readout" id="readout" aria-live="polite">
    <div class="value" id="value">26℃</div>
  </div>

  <div class="temp" id="tempRow">
    <button type="button" class="step" id="minus" data-i18n-aria="down" aria-label="Decrease 0.125°C">−</button>
    <input type="range" id="slider" min="16" max="32" step="0.125" value="26" data-i18n-aria="tempAria" aria-label="Temperature">
    <button type="button" class="step" id="plus" data-i18n-aria="up" aria-label="Increase 0.125°C">+</button>
  </div>

  <div class="mode" id="modeBox" data-state="on" role="group" data-i18n-aria="mode" aria-label="Mode">
    <span class="thumb" aria-hidden="true"></span>
    <button type="button" data-mode="on" aria-pressed="true" data-i18n="on">On</button>
    <button type="button" data-mode="off" aria-pressed="false" data-i18n="off">Off</button>
  </div>

  <button type="button" class="send" id="sendBtn">Send</button>
  <div class="status" id="status" role="status"></div>
</main>

<script>
(function () {
  "use strict";

  /* ── 設定 ── */
  const ROOM = "ac";            // 要發送到的聊天室名稱
  const COMMAND = "!ac-o";      // 指令前綴
  const SEND_FRACTIONS = false; // true:指令也用分數(如 !ac-o 26⅛);false:指令用小數(如 !ac-o 26.125)
  const SENDER_FALLBACK = "AC遙控";

  const db = firebase.database();

  /* ── i18n(預設英文) ── */
  const I18N = {
    en: { title:"AC Remote", on:"On", off:"Off", mode:"Mode",
          down:"Decrease 0.125°C", up:"Increase 0.125°C", tempAria:"Temperature",
          sending:"Sending…", sent:"Sent: ", failed:"Failed to send: ", langBtn:"中文", pageTitle:"AC Remote" },
    zh: { title:"冷氣遙控", on:"開", off:"關", mode:"模式",
          down:"降低 0.125 度", up:"提高 0.125 度", tempAria:"溫度",
          sending:"傳送中…", sent:"已發送:", failed:"發送失敗:", langBtn:"EN", pageTitle:"冷氣遙控" }
  };
  let lang = localStorage.getItem("acLang") === "zh" ? "zh" : "en";
  const t = k => I18N[lang][k];

  /* ── 狀態 ── */
  let mode = "on";
  const STEP = 0.125;
  const snap = n => Math.round(n / STEP) * STEP;   // 0.125 的倍數在浮點數中可精確表示
  let temp = snap(parseFloat(localStorage.getItem("acTemp") || "26"));
  if (!(temp >= 16 && temp <= 32)) temp = 26;

  const $ = id => document.getElementById(id);
  const readout = $("readout"), valueEl = $("value");
  const slider = $("slider"), tempRow = $("tempRow"), statusEl = $("status"), sendBtn = $("sendBtn");

  const FRAC = { 0.125:"⅛", 0.25:"¼", 0.375:"⅜", 0.5:"½", 0.625:"⅝", 0.75:"¾", 0.875:"⅞" };
  function fmt(n) {
    const whole = Math.floor(n);
    return whole + (FRAC[n - whole] || "");
  }

  function payload() { return COMMAND + " " + (mode === "off" ? "off" : (SEND_FRACTIONS ? fmt(temp) : String(temp))); }

  function render() {
    slider.value = temp;
    const off = mode === "off";
    slider.disabled = $("minus").disabled = $("plus").disabled = off;
    tempRow.classList.toggle("is-disabled", off);
    $("modeBox").dataset.state = mode;
    readout.classList.toggle("is-off", mode === "off");
    valueEl.textContent = mode === "off" ? t("off") : fmt(temp) + "℃";
    document.querySelectorAll(".mode button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  }

  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.title = t("pageTitle");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    $("langBtn").textContent = t("langBtn");
    render();
  }

  function setTemp(n) {
    temp = Math.max(16, Math.min(32, snap(n)));
    localStorage.setItem("acTemp", String(temp));
    render();
  }

  document.querySelectorAll(".mode button").forEach(b =>
    b.addEventListener("click", () => { mode = b.dataset.mode; render(); }));
  $("minus").addEventListener("click", () => setTemp(temp - STEP));
  $("plus").addEventListener("click", () => setTemp(temp + STEP));
  slider.addEventListener("input", () => setTemp(parseFloat(slider.value)));

  let statusTimer;
  function say(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status" + (cls ? " " + cls : "");
    clearTimeout(statusTimer);
    if (cls) statusTimer = setTimeout(() => { statusEl.textContent = ""; statusEl.className = "status"; }, 3500);
  }

  sendBtn.addEventListener("click", () => {
    const text = payload();
    const name = localStorage.getItem("chatName") || SENDER_FALLBACK;
    sendBtn.disabled = true;
    say(t("sending"));
    db.ref("messages/" + ROOM).push({ name: name, msg: text, time: Date.now() })
      .then(() => say(t("sent") + text, "ok"))
      .catch(err => say(t("failed") + (err && err.message ? err.message : err), "err"))
      .finally(() => { sendBtn.disabled = false; });
  });

  $("langBtn").addEventListener("click", () => {
    lang = lang === "en" ? "zh" : "en";
    localStorage.setItem("acLang", lang);
    applyLang();
  });

  applyLang();
})();
</script>
</body>
</html>

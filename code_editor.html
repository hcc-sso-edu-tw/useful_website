<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Python Web IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;background:#1e1e1e;color:white;font-family:Arial;}
#container{display:flex;height:100vh;}

#sidebar{
width:200px;
background:#252526;
padding:10px;
display:flex;
flex-direction:column;
}

.file{
padding:6px;
cursor:pointer;
border-radius:4px;
}

.file:hover{background:#333;}
.file.active{background:#444;}

button{
background:#007acc;
border:none;
color:white;
padding:6px;
margin-top:5px;
border-radius:4px;
cursor:pointer;
}

#editor-area{
flex:1;
display:flex;
flex-direction:column;
}

#topbar{
background:#333;
padding:8px;
display:flex;
gap:10px;
}

#terminal{
height:180px;
background:#111;
overflow:auto;
font-family:monospace;
padding:10px;
border-top:1px solid #444;
}

#terminal-input{
width:100%;
background:black;
color:white;
border:none;
padding:6px;
font-family:monospace;
outline:none;
}

.CodeMirror{flex:1;}
</style>

</head>

<body>

<div id="container">

<div id="sidebar">
<h3>Files</h3>
<div id="files"></div>

<button onclick="newFile()">New File</button> <button onclick="deleteFile()">Delete</button> <button onclick="downloadZip()">Download Zip</button>

</div>

<div id="editor-area">

<div id="topbar">
<button onclick="runCode()">Run ▶</button>
<button onclick="saveProject()">Save</button>
<button onclick="loadProject()">Load</button>
<button onclick="clearTerminal()">Clear</button>
<div id="status">Loading Python...</div>
</div>

<textarea id="editor"></textarea>

<div id="terminal"></div>
<input id="terminal-input" placeholder="input here then press Enter">

</div>

</div>

<script>

let editor = CodeMirror.fromTextArea(
document.getElementById("editor"),
{
mode:"python",
theme:"dracula",
lineNumbers:true,
indentUnit:4
}
);

const keywords=[
"False","None","True","and","as","assert","break","class","continue",
"def","elif","else","except","finally","for","from","global","if",
"import","in","is","lambda","not","or","pass","raise","return",
"try","while","with","yield","print","input","len","range"
];

CodeMirror.registerHelper("hint","python",(cm)=>{

let cur=cm.getCursor();
let token=cm.getTokenAt(cur);

let start=token.start;
let end=cur.ch;

let word=token.string.slice(0,end-start);

let code=cm.getValue();

let vars=[...new Set(code.match(/\b[a-zA-Z_]\w*\b/g)||[])];

let list=[...keywords,...vars].filter(x=>x.startsWith(word));

return{
list:list,
from:CodeMirror.Pos(cur.line,start),
to:CodeMirror.Pos(cur.line,end)
};

});

editor.on("inputRead",(cm,change)=>{

if(/[a-zA-Z_]/.test(change.text[0])){
cm.showHint({completeSingle:false});
}

});

let pyodide;

let waitingInputResolve=null;

async function initPython(){

pyodide=await loadPyodide();

pyodide.setStdout({
batched:(text)=>{
writeTerminal(text);
}
});

pyodide.setStdin({
stdin:()=>{
return new Promise(resolve=>{
waitingInputResolve=resolve;
});
}
});

document.getElementById("status").innerText="Python Ready";

}

initPython();

function writeTerminal(text){

let t=document.getElementById("terminal");

t.textContent+=text+"\n";

t.scrollTop=t.scrollHeight;

}

document.getElementById("terminal-input")
.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

let value=e.target.value;

writeTerminal("> "+value);

e.target.value="";

if(waitingInputResolve){

waitingInputResolve(value);

waitingInputResolve=null;

}

}

});

function clearTerminal(){

document.getElementById("terminal").textContent="";

}

async function runCode(){

clearTerminal();

try{

await pyodide.runPythonAsync(editor.getValue());

}catch(e){

writeTerminal(e);

}

}

let files={};

let currentFile=null;

function refreshFiles(){

let f=document.getElementById("files");

f.innerHTML="";

for(let name in files){

let div=document.createElement("div");

div.textContent=name;

div.className="file"+(name===currentFile?" active":"");

div.onclick=()=>switchFile(name);

f.appendChild(div);

}

}

function switchFile(name){

files[currentFile]=editor.getValue();

currentFile=name;

editor.setValue(files[name]);

refreshFiles();

}

function newFile(){

let name=prompt("File name","main.py");

if(!name)return;

files[name]="";

currentFile=name;

editor.setValue("");

refreshFiles();

}

function deleteFile(){

delete files[currentFile];

let k=Object.keys(files);

currentFile=k[0];

editor.setValue(files[currentFile]||"");

refreshFiles();

}

function saveProject(){

files[currentFile]=editor.getValue();

localStorage.setItem("py_project",JSON.stringify(files));

}

function loadProject(){

let d=localStorage.getItem("py_project");

if(!d)return;

files=JSON.parse(d);

currentFile=Object.keys(files)[0];

editor.setValue(files[currentFile]);

refreshFiles();

}

function downloadZip(){

files[currentFile]=editor.getValue();

let zip=new JSZip();

for(let f in files){

zip.file(f,files[f]);

}

zip.generateAsync({type:"blob"}).then(content=>{

let a=document.createElement("a");

a.href=URL.createObjectURL(content);

a.download="python_project.zip";

a.click();

});

}

files["main.py"]="name=input('Name: ')\nprint('Hello',name)\nage=input('Age: ')\nprint(age)";

currentFile="main.py";

editor.setValue(files[currentFile]);

refreshFiles();

</script>

</body>
</html>

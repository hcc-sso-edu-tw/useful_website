<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Barcode Scanner (Enhanced)</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;background:#f5f5f5;margin:0}
  h1{font-size:1.3rem;color:#333;margin:0 0 12px}
  #reader{width:100%;max-width:520px;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15);background:#000}
  #result{margin-top:16px;width:100%;max-width:520px;background:#fff;padding:14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  #result .label{font-size:.8rem;color:#666;margin-bottom:4px}
  #result .value{font-weight:700;color:#0066cc;font-family:monospace;font-size:1.2rem;word-break:break-all}
  .row{display:flex;gap:8px;margin-top:10px;width:100%;max-width:520px}
  .row input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem}
  button{padding:10px 18px;font-size:.95rem;background:#0066cc;color:#fff;border:none;border-radius:8px;cursor:pointer}
  button:hover{background:#0052a3}
  button:disabled{background:#ccc;cursor:not-allowed}
  .hint{color:#888;font-size:.82rem;margin-top:10px;text-align:center;max-width:520px}
  #debug{margin-top:8px;font-size:.75rem;color:#999;max-width:520px;word-break:break-all}
</style>
</head>
<body>
  <h1>📷 Barcode Scanner (Enhanced)</h1>
  <div id="reader"></div>
  <div id="result">
    <div class="label">Scan Result</div>
    <div class="value" id="scan-value">Waiting for scan…</div>
  </div>
  <div class="row">
    <button id="restart-btn" disabled>Restart Camera</button>
    <button id="stop-btn" disabled>Stop</button>
  </div>
  <div class="row">
    <input id="manual-input" type="text" placeholder="If the camera fails, type the barcode content…">
    <button id="manual-btn">Submit</button>
  </div>
  <p class="hint">Open over HTTPS or localhost. Hold the barcode horizontally, fill ~60% of the box, avoid glare.</p>
  <div id="debug"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
  (function(){
    const resultEl = document.getElementById('scan-value');
    const debugEl  = document.getElementById('debug');
    const restartBtn = document.getElementById('restart-btn');
    const stopBtn    = document.getElementById('stop-btn');
    let scanner = null, running = false;

    function log(msg){ debugEl.textContent = msg; }

    function showResult(text){
      resultEl.textContent = text;
      log('✅ Decoded: ' + text);
    }

    function onSuccess(decodedText){
      // Continuous mode: keep scanning and update the result (easier to align)
      showResult(decodedText);
    }

    function onError(msg){
      // Only surface meaningful errors to avoid console spam
      if (msg && msg.indexOf('NotFoundException') === -1) log('Scanning… ' + msg);
    }

    async function start(){
      if (running) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        log('❌ Camera not supported, or not on HTTPS/localhost');
        return;
      }
      if (scanner){ try{ await scanner.clear(); }catch(e){} }
      scanner = new Html5Qrcode("reader");

      const config = {
        fps: 15,
        qrbox: { width: 320, height: 180 },   // larger, wider box for 1D barcodes
        aspectRatio: 1.777,
        disableFlip: false,
        // Explicitly supported formats (including Code 128)
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      try{
        await scanner.start(
          { facingMode: "environment" },
          config,
          onSuccess,
          onError
        );
        running = true;
        restartBtn.disabled = true;
        stopBtn.disabled = false;
        log('Camera started. Align the barcode horizontally inside the box…');
      }catch(err){
        console.error(err);
        log('❌ Camera failed to start: ' + (err.message || err) + ' (check HTTPS, permissions, and that no other app is using the camera)');
      }
    }

    async function stop(){
      if (!scanner || !running) return;
      try{ await scanner.stop(); }catch(e){}
      running = false;
      restartBtn.disabled = false;
      stopBtn.disabled = true;
      log('Stopped');
    }

    restartBtn.addEventListener('click', ()=>{ resultEl.textContent='Waiting for scan…'; start(); });
    stopBtn.addEventListener('click', stop);

    document.getElementById('manual-btn').addEventListener('click', ()=>{
      const v = document.getElementById('manual-input').value.trim();
      if (v) showResult(v);
    });
    document.getElementById('manual-input').addEventListener('keydown', e=>{
      if (e.key === 'Enter') document.getElementById('manual-btn').click();
    });

    window.addEventListener('load', start);
    window.addEventListener('beforeunload', ()=>{ if(scanner && running) scanner.stop().catch(()=>{}); });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Barcode Scanner (ZXing)</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;background:#f5f5f5;margin:0}
  h1{font-size:1.3rem;color:#333;margin:0 0 12px}
  #video-container{width:100%;max-width:520px;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15);background:#000;position:relative}
  video{width:100%;display:block}
  #result{margin-top:16px;width:100%;max-width:520px;background:#fff;padding:14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  #result .label{font-size:.8rem;color:#666;margin-bottom:4px}
  #result .value{font-weight:700;color:#0066cc;font-family:monospace;font-size:1.2rem;word-break:break-all}
  .hint{color:#888;font-size:.82rem;margin-top:10px;text-align:center;max-width:520px}
  button{margin-top:10px;padding:10px 18px;font-size:.95rem;background:#0066cc;color:#fff;border:none;border-radius:8px;cursor:pointer}
  button:hover{background:#0052a3}
</style>
</head>
<body>
  <h1>📷 Barcode Scanner (ZXing Engine)</h1>
  <div id="video-container">
    <video id="video" playsinline></video>
  </div>
  <div id="result">
    <div class="label">Scan Result</div>
    <div class="value" id="scan-value">Waiting for scan…</div>
  </div>
  <button id="restart-btn">Start Camera</button>
  <p class="hint">Hold the barcode horizontally. Make sure the entire barcode is inside the camera view. Use HTTPS.</p>

  <!-- Use @zxing/library directly, which is much more reliable for Code 128 on iOS -->
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script>
  (function(){
    const video = document.getElementById('video');
    const resultEl = document.getElementById('scan-value');
    const restartBtn = document.getElementById('restart-btn');
    let codeReader = null;
    let scanning = false;

    async function startCamera() {
      if (scanning) return;
      resultEl.textContent = 'Starting camera…';

      try {
        // Request camera with high resolution for better barcode detail
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await video.play();

        // Initialize ZXing reader
        codeReader = new ZXing.BrowserMultiFormatReader();
        scanning = true;
        resultEl.textContent = 'Scanning…';
        restartBtn.textContent = 'Restart';

        // Continuously decode frames from the video element
        codeReader.decodeFromVideoDevice(null, video, (result, err) => {
          if (result) {
            resultEl.textContent = result.text;
            // Optional: stop after first successful scan
            // scanning = false;
            // codeReader.reset();
            // video.srcObject.getTracks().forEach(t => t.stop());
          }
          // Ignore normal "not found" errors to avoid noise
        });

      } catch (err) {
        console.error(err);
        resultEl.textContent = 'Camera error: ' + err.message;
      }
    }

    restartBtn.addEventListener('click', () => {
      if (scanning && codeReader) {
        codeReader.reset();
        scanning = false;
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
      }
      setTimeout(startCamera, 300);
    });

    // Auto-start on load
    window.addEventListener('load', startCamera);
  })();
  </script>
</body>
</html>
